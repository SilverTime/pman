[workspace]
resolver = "2"
members = [
    "crates/pman-protocol",
    "crates/pman-core",
    "crates/pman-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["pman contributors"]

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
hmac = "0.12"
pman-core = { path = "crates/pman-core" }
pman-protocol = { path = "crates/pman-protocol" }
pbkdf2 = "0.12"
rand = "0.8"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
url = "2.5"
uuid = { version = "1.0", features = ["v4"] }
zeroize = "1.8"
